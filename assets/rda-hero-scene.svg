<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Scandinavian carpentry interior with warm wood framing and natural window light">
  <defs>
    <linearGradient id="hsWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ece1"/>
      <stop offset="1" stop-color="#e4d8c6"/>
    </linearGradient>
    <linearGradient id="hsFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a4e"/>
      <stop offset="1" stop-color="#9a6938"/>
    </linearGradient>
    <linearGradient id="hsLight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff6e3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hsBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bf8a4f"/>
      <stop offset="1" stop-color="#8a5a2c"/>
    </linearGradient>
    <linearGradient id="hsBeamLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a567"/>
      <stop offset="1" stop-color="#a06d39"/>
    </linearGradient>
    <linearGradient id="hsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2ec"/>
      <stop offset="1" stop-color="#eaf2f3"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="1200" height="900" fill="url(#hsWall)"/>

  <!-- Window with daylight -->
  <g>
    <rect x="120" y="90" width="360" height="430" rx="6" fill="url(#hsSky)" stroke="#cdbcaa" />
    <rect x="120" y="90" width="360" height="430" rx="6" fill="none" stroke="#d9cab2" stroke-width="10"/>
    <line x1="300" y1="90" x2="300" y2="520" stroke="#d9cab2" stroke-width="8"/>
    <line x1="120" y1="305" x2="480" y2="305" stroke="#d9cab2" stroke-width="8"/>
    <!-- distant trees -->
    <g fill="#9fb89f" opacity="0.7">
      <circle cx="190" cy="430" r="36"/><circle cx="250" cy="450" r="28"/><circle cx="400" cy="440" r="40"/>
    </g>
  </g>

  <!-- Light beam across room -->
  <polygon points="480,140 1180,360 1180,640 480,420" fill="url(#hsLight)" opacity="0.55"/>

  <!-- Floor -->
  <polygon points="0,640 1200,640 1200,900 0,900" fill="url(#hsFloor)"/>
  <g stroke="#7d4f26" stroke-width="2" opacity="0.4">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="770" x2="1200" y2="770"/>
    <line x1="0" y1="840" x2="1200" y2="840"/>
    <line x1="200" y1="640" x2="160" y2="900"/>
    <line x1="500" y1="640" x2="500" y2="900"/>
    <line x1="800" y1="640" x2="860" y2="900"/>
  </g>

  <!-- Wood frame structure (right) -->
  <g>
    <rect x="720" y="120" width="40" height="520" fill="url(#hsBeam)"/>
    <rect x="1000" y="120" width="40" height="520" fill="url(#hsBeam)"/>
    <rect x="700" y="120" width="360" height="40" fill="url(#hsBeamLight)"/>
    <rect x="700" y="300" width="360" height="34" fill="url(#hsBeamLight)"/>
    <rect x="700" y="470" width="360" height="34" fill="url(#hsBeamLight)"/>
    <!-- diagonal brace -->
    <polygon points="760,300 800,300 1000,470 960,470" fill="url(#hsBeam)" opacity="0.9"/>
  </g>

  <!-- Stacked planks foreground -->
  <g>
    <rect x="120" y="690" width="430" height="26" rx="4" fill="#caa06a"/>
    <rect x="135" y="716" width="430" height="26" rx="4" fill="#b5824a"/>
    <rect x="150" y="742" width="430" height="26" rx="4" fill="#caa06a"/>
    <rect x="120" y="768" width="430" height="26" rx="4" fill="#b5824a"/>
  </g>

  <!-- Sawhorse with plank -->
  <g stroke="#6f4a24" stroke-width="10" stroke-linecap="round">
    <line x1="560" y1="560" x2="520" y2="640"/>
    <line x1="560" y1="560" x2="600" y2="640"/>
    <line x1="700" y1="560" x2="660" y2="640"/>
    <line x1="700" y1="560" x2="740" y2="640"/>
  </g>
  <rect x="470" y="540" width="320" height="26" rx="5" fill="#d8a567" transform="rotate(-2 630 553)"/>

  <!-- Tools: measuring tape + level on plank -->
  <g transform="translate(150,668)">
    <rect x="0" y="-22" width="50" height="40" rx="6" fill="#f5b81f"/>
    <rect x="6" y="-16" width="38" height="20" rx="3" fill="#1f1c19"/>
    <circle cx="25" cy="-2" r="6" fill="#c9c9c9"/>
  </g>

  <!-- Hand saw leaning -->
  <g transform="translate(1010,470)">
    <polygon points="0,0 -40,150 -8,160 30,12" fill="#b9bfc4"/>
    <polygon points="0,0 30,12 36,2 6,-10" fill="#7a5230"/>
    <g stroke="#8a9097" stroke-width="2"><path d="M-36 148 l30 8 M-32 132 l30 8 M-28 116 l30 8"/></g>
  </g>

  <!-- Blueprint roll -->
  <g transform="translate(640,720)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#22436f"/>
    <rect x="0" y="0" width="180" height="40" rx="20" fill="none" stroke="#3d639e" stroke-width="2"/>
    <ellipse cx="180" cy="20" rx="14" ry="20" fill="#1a3357"/>
    <ellipse cx="180" cy="20" rx="7" ry="12" fill="#2e4a78"/>
  </g>

  <!-- Soft vignette -->
  <rect width="1200" height="900" fill="#1a1310" opacity="0.04"/>
</svg>
