<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Herringbone wood flooring installation">
  <defs>
    <linearGradient id="flBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ebe0"/><stop offset="1" stop-color="#e6dccb"/></linearGradient>
  </defs>
  <rect width="640" height="440" fill="url(#flBg)"/>
  <!-- wall + skirting -->
  <rect x="0" y="0" width="640" height="150" fill="#ece4d6"/>
  <rect x="0" y="150" width="640" height="12" fill="#cbbda4"/>
  <!-- herringbone floor -->
  <g stroke="#7d4f26" stroke-width="1.5">
    <g fill="#c89357"><rect x="40" y="190" width="70" height="22" transform="rotate(45 75 201)"/></g>
    <g fill="#b07f44"><rect x="100" y="190" width="70" height="22" transform="rotate(-45 135 201)"/></g>
    <g fill="#c89357"><rect x="160" y="190" width="70" height="22" transform="rotate(45 195 201)"/></g>
    <g fill="#b07f44"><rect x="220" y="190" width="70" height="22" transform="rotate(-45 255 201)"/></g>
    <g fill="#c89357"><rect x="280" y="190" width="70" height="22" transform="rotate(45 315 201)"/></g>
    <g fill="#b07f44"><rect x="340" y="190" width="70" height="22" transform="rotate(-45 375 201)"/></g>
    <g fill="#c89357"><rect x="400" y="190" width="70" height="22" transform="rotate(45 435 201)"/></g>
    <g fill="#b07f44"><rect x="460" y="190" width="70" height="22" transform="rotate(-45 495 201)"/></g>

    <g fill="#b07f44"><rect x="40" y="270" width="80" height="24" transform="rotate(45 80 282)"/></g>
    <g fill="#c89357"><rect x="110" y="270" width="80" height="24" transform="rotate(-45 150 282)"/></g>
    <g fill="#b07f44"><rect x="180" y="270" width="80" height="24" transform="rotate(45 220 282)"/></g>
    <g fill="#c89357"><rect x="250" y="270" width="80" height="24" transform="rotate(-45 290 282)"/></g>
    <g fill="#b07f44"><rect x="320" y="270" width="80" height="24" transform="rotate(45 360 282)"/></g>
    <g fill="#c89357"><rect x="390" y="270" width="80" height="24" transform="rotate(-45 430 282)"/></g>
    <g fill="#b07f44"><rect x="460" y="270" width="80" height="24" transform="rotate(45 500 282)"/></g>
  </g>
  <!-- one plank being placed -->
  <rect x="430" y="360" width="150" height="30" rx="3" fill="#d8a567" stroke="#8a5c30" stroke-width="2"/>
</svg>
