<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="Finished premium interior with warm wood floor, paneling and natural light">
  <defs>
    <linearGradient id="afWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4eee3"/><stop offset="1" stop-color="#e8ddca"/></linearGradient>
    <linearGradient id="afFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c89357"/><stop offset="1" stop-color="#a06d39"/></linearGradient>
    <linearGradient id="afSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2ec"/><stop offset="1" stop-color="#eef4f2"/></linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#afWall)"/>
  <!-- wood slat feature wall -->
  <g fill="#bf8a4f">
    <rect x="60" y="70" width="18" height="360" rx="3"/><rect x="88" y="70" width="18" height="360" rx="3"/><rect x="116" y="70" width="18" height="360" rx="3"/><rect x="144" y="70" width="18" height="360" rx="3"/><rect x="172" y="70" width="18" height="360" rx="3"/><rect x="200" y="70" width="18" height="360" rx="3"/>
  </g>
  <!-- large window -->
  <rect x="600" y="90" width="320" height="330" rx="6" fill="url(#afSky)" stroke="#d9cab2" stroke-width="12"/>
  <line x1="760" y1="90" x2="760" y2="420" stroke="#d9cab2" stroke-width="8"/>
  <line x1="600" y1="255" x2="920" y2="255" stroke="#d9cab2" stroke-width="8"/>
  <g fill="#9fb89f" opacity="0.7"><circle cx="680" cy="350" r="40"/><circle cx="860" cy="360" r="46"/></g>
  <!-- light pool -->
  <polygon points="600,120 320,460 520,460 720,120" fill="#fff6e3" opacity="0.4"/>
  <!-- floor -->
  <polygon points="0,460 1000,460 1000,700 0,700" fill="url(#afFloor)"/>
  <g stroke="#7d4f26" stroke-width="2" opacity="0.4"><line x1="0" y1="540" x2="1000" y2="540"/><line x1="0" y1="620" x2="1000" y2="620"/><line x1="350" y1="460" x2="300" y2="700"/><line x1="700" y1="460" x2="760" y2="700"/></g>
  <!-- sofa -->
  <rect x="330" y="470" width="300" height="90" rx="16" fill="#6f7a64"/>
  <rect x="330" y="452" width="300" height="36" rx="14" fill="#7c8870"/>
  <rect x="350" y="470" width="80" height="60" rx="10" fill="#86927a"/>
  <!-- coffee table -->
  <rect x="400" y="600" width="160" height="16" rx="4" fill="#8a5c30"/>
  <g stroke="#7d4f26" stroke-width="6"><line x1="415" y1="616" x2="415" y2="660"/><line x1="545" y1="616" x2="545" y2="660"/></g>
  <!-- plant -->
  <rect x="120" y="560" width="40" height="60" rx="4" fill="#b58a52"/>
  <g fill="#3a5a40"><ellipse cx="140" cy="520" rx="40" ry="56"/></g>
  <!-- pendant -->
  <line x1="500" y1="70" x2="500" y2="150" stroke="#2a241c" stroke-width="2"/>
  <path d="M478 150 a22 16 0 0 0 44 0 z" fill="#2a241c"/>
  <rect width="1000" height="700" fill="#1a1310" opacity="0.03"/>
</svg>
